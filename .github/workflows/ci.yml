name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.8.0
        with:
          node-version: "24"
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install -- --legacy-peer-deps
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
